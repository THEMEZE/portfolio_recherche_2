<script>
  let allDocs = [];
  let selectedTags = []; // MAIS objets maintenant
  let currentMode = "union";

  function flattenDocs(tree) {
    let result = [];

    function recurse(node) {
      if (node.type === "file") {
        result.push({
          name: node.name,
          path: node.path,
        });
      }

      if (node.type === "folder" && node.children) {
        node.children.forEach(recurse);
      }
    }

    tree.forEach(recurse);
    return result;
  }

  function flattenDocs(tree) {
    let result = [];

    function recurse(node, parentKeywords = []) {
      if (node.type === "file") {
        result.push({
          name: node.name,
          path: node.path,
          keywords: parentKeywords,
        });
      }

      if (node.type === "folder") {
        const newKeywords = [...parentKeywords, node.name];

        (node.children || []).forEach((child) => recurse(child, newKeywords));
      }
    }

    tree.forEach((n) => recurse(n));
    return result;
  }

  async function loadDocs() {
    try {
      const [docsRes, searchRes] = await Promise.all([
        fetch("docs.json"),
        fetch("search.json"),
      ]);

      const docsTree = await docsRes.json();
      const searchData = await searchRes.json();

      const flatDocs = flattenDocs(docsTree);

      // fusion
      allDocs = flatDocs.map((doc) => {
        const meta = searchData.find((m) => m.path === doc.path);
        return {
          ...doc,
          author: meta?.author || [],
          category: meta?.category || [],
          keywords: [...(doc.keywords || []), ...(meta?.keywords || [])],
        };
      });

      updateDocs(allDocs);
      renderFilteredDocs(allDocs);
    } catch (err) {
      console.error(err);
    }
  }

  function initDocs() {
    $("#docs li.folder").addClass("closed");

    $("#docs li.folder > strong").wrap('<a href="#"></a>');
  }

  // Affiche l'arborescence avec icône 📂 ouvert/fermé
  function updateDocs(docs) {
    const container = document.querySelector("#docs ul");
    container.innerHTML = "";

    const keywordMap = {};

    docs.forEach((doc) => {
      (doc.keywords || []).forEach((kw) => {
        const k = kw;
        if (!keywordMap[k]) keywordMap[k] = [];
        keywordMap[k].push(doc);
      });
    });

    Object.keys(keywordMap)
      .sort()
      .forEach((kw) => {
        const li = document.createElement("li");
        li.className = "folder closed";

        const a = document.createElement("a");
        a.href = "#";

        const strong = document.createElement("strong");
        // strong.innerHTML = `📁 ${kw}`;
        strong.innerHTML = `${kw}`;

        a.appendChild(strong);
        li.appendChild(a);

        const ul = document.createElement("ul");

        keywordMap[kw].forEach((doc) => {
          const liDoc = document.createElement("li");
          liDoc.className = "document";

          const aDoc = document.createElement("a");
          aDoc.href = doc.path;
          aDoc.target = "_blank";
          aDoc.rel = "noopener";
          aDoc.textContent = doc.name;

          liDoc.appendChild(aDoc);
          ul.appendChild(liDoc);
        });

        li.appendChild(ul);

        // toggle propre
        a.addEventListener("click", (e) => {
          e.preventDefault();
          li.classList.toggle("closed");

          // if (li.classList.contains("closed")) {
          //   strong.innerHTML = `📁 ${kw}`;
          // } else {
          //   strong.innerHTML = `📂 ${kw}`;
          // }
        });

        container.appendChild(li);
      });
  }

  // Filtrage

  function fuzzyMatch(text, query) {
    return text.includes(query) || text.startsWith(query);
  }

  function filterDocs(tags) {
    if (!tags.length) return allDocs;

    return allDocs
      .map((doc) => {
        let score = 0;
        let matchesPerTag = [];

        tags.forEach((tag) => {
          const val = tag.value.toLowerCase();
          let matched = false;

          // ===== NAME =====
          if (tag.type === "name") {
            const name = (doc.name || "").toLowerCase();

            if (name === val) {
              score += 20;
              matched = true;
            } else if (fuzzyMatch(name, val)) {
              score += 10;
              matched = true;
            }
          }

          // ===== AUTHOR =====
          else if (tag.type === "author") {
            (doc.author || []).forEach((a) => {
              const aa = a.toLowerCase();
              if (aa === val) {
                score += 10;
                matched = true;
              } else if (fuzzyMatch(aa, val)) {
                score += 5;
                matched = true;
              }
            });
          }

          // ===== CATEGORY =====
          else if (tag.type === "category") {
            (doc.category || []).forEach((c) => {
              const cc = c.toLowerCase();
              if (cc === val) {
                score += 6;
                matched = true;
              } else if (fuzzyMatch(cc, val)) {
                score += 3;
                matched = true;
              }
            });
          }

          // ===== KEYWORD =====
          else {
            (doc.keywords || []).forEach((k) => {
              const kk = k.toLowerCase();
              if (kk === val) {
                score += 4;
                matched = true;
              } else if (fuzzyMatch(kk, val)) {
                score += 2;
                matched = true;
              }
            });
          }

          matchesPerTag.push(matched);
        });

        return { ...doc, score, matchesPerTag };
      })
      .filter((doc) => {
        if (currentMode === "union") {
          return doc.score > 0;
        }

        if (currentMode === "intersection") {
          // 🔥 CHAQUE tag doit matcher
          return doc.matchesPerTag.every((m) => m === true);
        }
      })
      .sort((a, b) => b.score - a.score);
  }

  function parseQuery(input) {
    const tokens = input.split(/\s+/);
    const tags = [];

    tokens.forEach((token) => {
      const match = token.match(/^(\w+):(.*)$/);

      if (match) {
        const [, type, value] = match;

        if (["author", "keyword", "category", "name"].includes(type)) {
          tags.push({ type, value });
          return;
        }
      }

      // fallback = keyword
      if (token.trim()) {
        tags.push({ type: "keyword", value: token });
      }
    });

    return tags;
  }

  function renderTags() {
    const container = $("#tagsInline");
    container.empty();

    selectedTags.forEach((tag) => {
      const tagDiv = $(
        `<div class="tag ${tag.type}">${tag.value}<span>×</span></div>`,
      );

      tagDiv.find("span").click(() => {
        // selectedTags = selectedTags.filter((t) => t.value !== tag.value);
        selectedTags = selectedTags.filter(
          (t) => !(t.value === tag.value && t.type === tag.type),
        );
        renderTags();

        const filtered = filterDocs(selectedTags);
        updateDocs(filtered);
        renderFilteredDocs(filtered);
      });

      container.append(tagDiv);
    });
  }

  // Suggestions dynamiques
  $("#searchInput").on("input", function () {
    const q = $(this).val().toLowerCase();
    if (!q) {
      $("#suggestions").hide();
      return;
    }
    const sugMap = new Map();

    allDocs.forEach((d) => {
      (d.keywords || []).forEach((k) => {
        if (k.toLowerCase().includes(q)) sugMap.set(k, "keyword");
      });

      (d.author || []).forEach((a) => {
        if (a.toLowerCase().includes(q)) sugMap.set(a, "author");
      });

      (d.category || []).forEach((c) => {
        if (c.toLowerCase().includes(q)) sugMap.set(c, "category");
      });

      if ((d.name || "").toLowerCase().includes(q)) {
        sugMap.set(d.name, "name");
      }
    });
    const sugDiv = $("#suggestions");
    // sugDiv.html(
    //   "<ul>" +
    //     Array.from(sugSet)
    //       .slice(0, 10)
    //       .map((s) => `<li>${s}</li>`)
    //       .join("") +
    //     "</ul>",
    // );
    sugDiv.html(
      "<ul>" +
        Array.from(sugMap.entries())
          .slice(0, 10)
          .map(
            ([value, type]) =>
              `<li data-type="${type}" data-value="${value}">
          <span class="tag ${type}">${type}</span> ${value}
        </li>`,
          )
          .join("") +
        "</ul>",
    );
    sugDiv.show();
  });

  $("#searchInput").on("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();

      const input = $(this).val();

      const newTags = parseQuery(input);

      newTags.forEach((tag) => {
        if (
          !selectedTags.some(
            (t) => t.value === tag.value && t.type === tag.type,
          )
        ) {
          selectedTags.push(tag);
        }
      });

      renderTags();

      $(this).val("");

      const filtered = filterDocs(selectedTags);
      updateDocs(filtered);
      renderFilteredDocs(filtered);
    }
  });

  $("#suggestions").on("click", "li", function () {
    const val = $(this).data("value");
    const type = $(this).data("type");

    if (!selectedTags.some((t) => t.value === val && t.type === type)) {
      selectedTags.push({ value: val, type: type });
    }

    renderTags();

    $("#searchInput").val("").focus();
    $("#suggestions").hide();

    const filtered = filterDocs(selectedTags);
    updateDocs(filtered);
    renderFilteredDocs(filtered);
  });

  $("#searchInput").on("keydown", function (e) {
    if (e.key === "Backspace" && !this.value) {
      selectedTags.pop();
      renderTags();

      const filtered = filterDocs(selectedTags);
      updateDocs(filtered);
      renderFilteredDocs(filtered);
    }
  });

  $(document).click((e) => {
    if (!$(e.target).closest("#suggestions, #searchInput").length)
      $("#suggestions").hide();
  });

  // Boutons Union / Intersection
  $("#btnUnion").click(() => {
    currentMode = "union";
    const filtered = filterDocs(selectedTags);
    updateDocs(filtered);
    renderFilteredDocs(filtered);
  });
  $("#btnIntersection").click(() => {
    currentMode = "intersection";
    const filtered = filterDocs(selectedTags);
    updateDocs(filtered);
    renderFilteredDocs(filtered);
  });

  // Affiche liste des documents filtrés cliquables
  function renderFilteredDocs(docs) {
    const container = $("#filteredList");
    if (!selectedTags.length) {
      container.html("");
      return;
    }
    container.html(
      "<ul>" +
        docs
          .map(
            (doc) =>
              `<li><a href="${doc.path}" target="_blank">${doc.name}</a></li>`,
          )
          .join("") +
        "</ul>",
    );
  }

  $(document).ready(() => loadDocs());
